name: rosas-candy

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_ENGINE: sqlite
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/rosas-candy.db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina uma chave secreta longa}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina os hosts permitidos}
      FRONTEND_URL: ${FRONTEND_URL:?Defina a URL publica do painel}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina as origens CORS permitidas}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Defina as origens CSRF confiaveis}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8000"
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8087}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8085}:80"
    networks: [internal]

volumes:
  sqlite_data:

networks:
  internal:
    driver: bridge
