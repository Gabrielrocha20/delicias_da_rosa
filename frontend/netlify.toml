# Painel web da Doces Mivi no Netlify.
# No Netlify: Add new site → Import from Git → "Base directory" = frontend (o resto vem deste arquivo).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Endereço da API no PythonAnywhere. É lido na hora do build (não é segredo).
  VITE_API_URL = "https://yroshiii.pythonanywhere.com/api"

# O painel é uma SPA: qualquer rota (ex.: /insumos) abre o index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
